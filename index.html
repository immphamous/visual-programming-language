<style>
    
    body {
        font-family: "Roboto", sans-serif;
    }
    .header {
        color: gray;
        margin-bottom: 0;
    }
    .label {
        margin-top: 2em;

    .sortable-list {
        
        display: flex;

        padding-left: 1em;
        padding:0.4em;

        list-style-type: none;
        
        /* background-color:lightgrey; */
        
    }
    .sortable-item {
        /* padding: 0.25em; */
    }

        flex-grow: 0;

    .sortable-item input {
        field-sizing: content;
        min-width: 2.2em;

    .sortable-item select {

    }

        opacity: 0.5;
    }

    #draggable-slots {
        display: flex;
        gap: 0.2em;

    }

        cursor: grab;
    }
    .draggable-slot {
        background-color: #645de8;
        border: 2px solid #403ab0;
        color: white;
        padding:0.2em;
        padding-left:0.6em;

        justify-content: center;

        height: 27px;

        word-break: none;
        position: relative;
        z-index: 1;
    }
    .draggable-slot:has(button) {
        padding-right:0.2em;
    }
    .draggable-slot button {
        background-color: inherit;
        border: none;
        color: white;
        
        font-size: 1.4em;
        
        border-radius:1em;
        
        box-sizing: border-box;
        height: 20px;
        width: 20px;
        
        flex-shrink: 0;
        
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
    }
    .draggable-slot:has(button:hover) {
        border: 2px dashed #403ab0;
        opacity: 0.5;
    }
    .new-option {
        background-color: darkgrey;
        border: 2px solid grey;
        color: white;
        padding:0.2em;
        padding-left:0.6em;
        padding-right:0.6em;
        
        font-size: 14px;
        
        border-radius:1em;
        
        cursor: pointer;
        
        box-sizing: border-box;
        height: 27px;
        width: 27px;
        
        display: flex;
        align-items: center;
        justify-content:center;
        font-size: 1.2em;
        
        transition: transform 0.2s;
    }
    .new-option:hover {
        transform: rotate(180deg);
    }
    .slot {
        pointer-events: none;
    }
    .slot input, .slot .draggable-slot {
        pointer-events: auto;
    }
    .slot:has(.draggable-slot) input {
        display: none;
    }
    .slot:has(.hidden) input {
        display: block;
    }
    
    .dragging-over input {
        border: 2px solid #fff27a;
    }
    .dragging-over div {
        border: 2px solid #fff27a;
    }

        background-color: #69d1a4;
        border: 2px solid #53ad86;
    }

        background-color: #645de8;
        border: 2px solid #403ab0;
    }

        background-color: #4a6e94;

        border: 2px solid #00dd00;

<script>
    let target = null, draggingItem = null, draggingSlot = null;
    
    
    
    function isBefore(el1, el2) {
        if (el2.parentNode === el1.parentNode)
        for (var cur = el1.previousSibling; cur && cur.nodeType !== 9; cur = cur.previousSibling)
          if (cur === el2)
            return true;
        return false;
    }
    
    function initSlot(slot) {
        $(slot).on('dragstart', (e) => {
            
            var newSlot = $('<div>').text($(slot).text());
            newSlot.addClass($(slot).attr('class'))
            
            var xButton = $('<button>').appendTo(newSlot);
            var i = $('<i>').addClass("bi bi-x").appendTo(xButton);
            xButton.on("click", (e) => {
                newSlot.remove();
            })
            
            draggingSlot = newSlot;
        })
        $(slot).on('dragend', (e) => {
            draggingSlot.removeClass('dragging');
            
            var chosenSlot = $('.dragging-over');
            if(chosenSlot.length) {
                chosenSlot.find('.draggable-slot').remove();
                
                $(chosenSlot).append(draggingSlot);
                $(chosenSlot).removeClass('dragging-over');
                
            } else {
                draggingSlot.remove();
                console.log("bye !")
            }
            
            
            draggingSlot = null;
        })
    }
    
    var slots = $('.draggable-slot');
    slots.each((index, slot) => {
        initSlot(slot);
    });
    
    function initList(list) {
        $(list).on('dragover', (e) => {
            console.log("HI");
            
            if(!draggingItem) return;
            if($(list).children().length > 0) {
                console.log(list.children.length)
                return;
            }
            console.log(e.target.classList);
            e.target.appendChild(draggingItem);
            e.preventDefault();
        })
    }
    
    function newList(name) {
        if(!name) {
            name = prompt("What will be the name of the label?");
            if(!name) return;
        }
        
        var list = $('<div>').addClass('label').appendTo('#labels');
        var header = $('<div>', { "draggable": true }).addClass('draggable-slot catagory-label').text(name).appendTo(list);
        if(name != "begin") {
            var xButton = $('<button>').appendTo(header);
            
            var i = $('<i>').addClass("bi bi-x").appendTo(xButton);
            xButton.on("click", (e) => {
                list.remove();
            
                $(`.draggable-slot`).filter('.catagory-label').each((index, value) => {
                    if($(value).text() == name) $(value).remove();
                });
                
            })
            
        }
        
        initSlot(header);
        
        var ul = $('<ul>').addClass('sortable-list').appendTo(list);
        initList(ul);
        
        return ul;
    }
    
    // newList("it_was_true");
    
    $('#newList').on('click', (e) => {
        newList()
    })
    
    var lists = $('.sortable-list');
    lists.each((index, list) => {
        initList(list)
    });
    
    function initItem(item) {
        // console.log(item);
        var dragIcon = $(item).find('.drag-icon');
        
        $(item).on('mousedown', (e) => {
            target = e.target;
            // console.log(target);
        })
        $(item).on('dragstart', (e) => {
            // console.log('start 2');
            if($.contains(dragIcon.get(0), $(target).get(0))) {
                // console.log('start 3');
                draggingItem = e.target;
                draggingItem.classList.add('dragging');
            } else {
                /*if($(target).hasClass('draggable-slot')) {
                    /*$(target).trigger('dragstart');
                    e.stopPropagation();
                } else*/
                e.preventDefault();
            }
        })
        $(item).on('dragend', (e) => {
            if(!draggingItem) return;
            
            draggingItem.classList.remove('dragging');
            draggingItem = null;
        })
        $(item).on('dragover', (e) => {
            if(!draggingItem) return;
            
            var target = e.target;
            (e.target.classList.contains('visual-item'))
                target = target.parentNode;
            
            if(!target.classList.contains('sortable-item')) return;
            
            if (isBefore(draggingItem, target))
                target.parentNode.insertBefore(draggingItem, target);
            else
                target.parentNode.insertBefore(draggingItem, target.nextSibling);
        })
        $(item).find('.slot').each((index, slot) => {
            $(slot).on('dragenter', (e) => {
                console.log("YAY")
                if(!draggingSlot) return;
                /*$(input).addClass('hidden');*/
                $(slot).addClass('dragging-over');
                // slot.append(draggingSlot.get(0));
            })
            $(slot).on('dragover', (e) => {
                e.preventDefault();
            })
            $(slot).on('dragleave', (e) => {
                /*$(input).removeClass('hidden');*/
                
                if(e.target == slot) {
                    console.log("HI")
                    return;
                }
                
                console.log(e.target);
                $(slot).removeClass('dragging-over');
                // draggingSlot.insertAfter(input);
            })
        })
    }
    
    const itemPresets = {
        "print": {
            catagory: 'output',
            sectors: [
                {
                    type: 'text',
                    content: 'print'
                },
                {
                    type: 'input',
                    content: 'Hello, World!'
                },
            ]
        },
        "jump_if": {
            catagory: 'move',
            sectors: [
                {
                    type: 'text',
                    content: 'jump to'
                },
                {
                    type: 'input',
                    content: '0'
                },
                {
                    type: 'text',
                    content: 'if'
                },
                {
                    type: 'input',
                    content: ''
                },
                {
                    type: 'options',
                    content: ['==', '!=', '<', '>', '<=', '>=']
                },
                {
                    type: 'input',
                    content: ''
                },
            ]
        },
        "jump_to": {
            catagory: 'move',
            sectors: [
                {
                    type: 'text',
                    content: 'jump to'
                },
                {
                    type: 'input',
                    content: '0'
                },
            ]
        },
        "return": {
            catagory: 'move',
            sectors: [
                {
                    type: 'text',
                    content: 'return'
                },
            ]
        },
        "set_slot": {
            catagory: 'slot',
            sectors: [
                {
                    type: 'text',
                    content: 'set'
                },
                {
                    type: 'options',
                    content: ['my slot', 'my slot 2']
                },
                {
                    type: 'text',
                    content: 'to'
                },
                {
                    type: 'input',
                    content: '0'
                },
            ]
        },
        "change_slot": {
            catagory: 'slot',
            sectors: [
                {
                    type: 'text',
                    content: 'change'
                },
                {
                    type: 'options',
                    content: ['my slot', 'my slot 2']
                },
                {
                    type: 'text',
                    content: 'by'
                },
                {
                    type: 'input',
                    content: '1'
                },
            ]
        },
    }
    
    function newItem(itemPreset, parent) {
        var li = $('<li>', { "draggable": true }).addClass('sortable-item').appendTo(parent);
        var div = $('<div>').addClass('visual-item').appendTo(li);
        var handleSpan = $('<span>').addClass('drag-icon').appendTo(div);
        var handle = $('<i>').addClass('bi bi-grip-vertical').appendTo(handleSpan);
        div.addClass('catagory-' + itemPreset.catagory);
        itemPreset.sectors.forEach(sector => {
            if(sector.type == "text") {
                $('<span>').addClass('item-text').text(sector.content).appendTo(div);
            }
            if(sector.type == "input") {
                var slot = $('<slot>').addClass('slot').appendTo(div);
                $('<input>').val(sector.content).appendTo(slot);
            }
            if(sector.type == "options") {
                var select = $('<select>').appendTo(div);
                sector.content.forEach(option => {
                    $('<option>').text(option).appendTo(select);
                })
            }
        })
        
        initItem(li);
    }
    
    var items = $('.sortable-item');
    items.each((index, item) => {
        initItem(item);
    });
    
    var begin = newList("begin");
    newItem(itemPresets["print"], begin);
    newItem(itemPresets["set_slot"], begin);
    newItem(itemPresets["change_slot"], begin);
    newItem(itemPresets["jump_to"], begin);
    newItem(itemPresets["jump_if"], begin);
    newItem(itemPresets["return"], begin);
    
</script>
